name: M14 F06 qualification

on:
  push:
    branches: [codex/m15-focused-checks-20261030, codex/local-native-staging-repair]
    paths:
      - 'kernel/**'
      - 'arch/x86_64/kernel/**'
      - 'lib/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'config.h.in'
      - 'CMakeLists.txt'
      - 'ihk'
      - 'executer/user/mcexec.c'
      - 'executer/user/rust/mcexec_helpers.rs'
      - '.github/workflows/m14-f06-qualification.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'arch/x86_64/kernel/**'
      - 'lib/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'config.h.in'
      - 'CMakeLists.txt'
      - 'ihk'
      - 'executer/user/mcexec.c'
      - 'executer/user/rust/mcexec_helpers.rs'
      - '.github/workflows/m14-f06-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  f06:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kernel/
            /arch/
            /lib/
            /scripts/
            /config/
            /cmake/
            /config.h.in
            /CMakeLists.txt
            /executer/user/mcexec.c
            /executer/user/rust/mcexec_helpers.rs
      - name: Verify source and pin ordinary HOST tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          rustup toolchain install nightly-2026-02-19 --profile minimal
          compiler=$(rustup which --toolchain nightly-2026-02-19 rustc)
          test "$("$compiler" --version)" = 'rustc 1.95.0-nightly (c04308580 2026-02-18)'
          python3 -m venv "$RUNNER_TEMP/f06-tools"
          "$RUNNER_TEMP/f06-tools/bin/pip" install --disable-pip-version-check cmake==3.28.3 ninja==1.11.1.1
          echo "RUSTC=$compiler" >> "$GITHUB_ENV"
          echo "CMAKE=$RUNNER_TEMP/f06-tools/bin/cmake" >> "$GITHUB_ENV"
          echo "NINJA=$RUNNER_TEMP/f06-tools/bin/ninja" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/f06-tools/bin" >> "$GITHUB_PATH"
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin 5a5d7e77ab4ada91777f1ee06c5d7fbdb98f5b71
          git show 5a5d7e77ab4ada91777f1ee06c5d7fbdb98f5b71:arch/x86_64/kernel/syscall.c > /dev/null
      - name: Run committed-source regressions and reject skips
        run: python3 -B scripts/run_m14_focused_checks.py --json-output "$RUNNER_TEMP/f06-regressions.json"
      - name: Verify actual C ownership and debugger data ABI
        run: |
          set -euo pipefail
          python3 -B scripts/restore_ihk_source.py --destination "$RUNNER_TEMP/f06-ihk"
          python3 -B scripts/m14_f06_qualify.py --ihk-source "$RUNNER_TEMP/f06-ihk" --output "$RUNNER_TEMP/f06-ownership.json"
          git diff --exit-code
      - name: Preserve bounded results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m14-f06-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            ${{ runner.temp }}/f06-regressions.json
            ${{ runner.temp }}/f06-ownership.json
          if-no-files-found: warn
          retention-days: 14
