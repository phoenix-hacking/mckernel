permissions:
  contents: read

env:
  ROCKY_IMAGE: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176
  EXPECTED_HEAD_SHA: ${{ inputs.validation_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-build:
    name: Compile three native modules (credit forbidden)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    container:
      image: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176
    defaults:
      run:
        shell: bash

    steps:
      - name: Refuse the wrong runtime and install exact build tools
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-rust-build-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' "bootstrap-started" > "$evidence_dir/workflow-state"
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = rocky
          test "$VERSION_ID" = 10.2
          dnf -y --setopt=install_weak_deps=False install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y --setopt=install_weak_deps=False install \
            bc binutils bison bindgen-cli bpftool cargo clang cpio diffutils \
            dwarves elfutils-libelf-devel findutils flex gcc git-core gzip \
            hostname kernel-rpm-macros kmod lld llvm make ncurses-devel \
            openssl openssl-devel patch perl python3 python3-devel python3-pyyaml redhat-rpm-config \
            rpm-build rust rust-src rustfmt tar which xz zstd
          openssl_path="$(command -v openssl)"
          test "$openssl_path" = /usr/bin/openssl
          test "$(rpm -qf --qf '%{NAME}\n' "$openssl_path")" = openssl
          openssl version
          dnf clean all
          printf '%s\n' "bootstrap-complete" > "$evidence_dir/workflow-state"

      - name: Check out the exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          # The shared-ABI checker reads exact frozen superproject blobs from
          # ROOT_REF as well as the current candidate.  A depth-1 checkout
          # leaves that immutable commit object unavailable.
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify source-only contracts without claiming readiness
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C ihk rev-parse HEAD)" = "3114d9e7101ad52030eb3effa849a5c108972a1f"
          python3 scripts/linux_api_exact_probe.py \
            --repo "$GITHUB_WORKSPACE" check-contract
          python3 scripts/x86_64_shared_abi.py \
            --repo-root "$GITHUB_WORKSPACE" --check
          python3 scripts/native_rust_build_surface_audit.py
          python3 scripts/native_rust_host_audit.py
          python3 scripts/rocky_rust_staging.py --repo "$GITHUB_WORKSPACE" --check
          python3 scripts/ihk_native_lifecycle_check.py --repo "$GITHUB_WORKSPACE"
          python3 scripts/ihk_native_queue_check.py --repo "$GITHUB_WORKSPACE" \
            --rustc "$(command -v rustc)" --require-rustc
          python3 scripts/ihk_os_registry_check.py --repo "$GITHUB_WORKSPACE"
          test "$(rustc --version | awk '{print $2}')" = "1.92.0"
          MCKERNEL_RUSTC_1_92="$(command -v rustc)" \
            python3 -m unittest -v scripts.tests.test_ihk_os_registry_check
          python3 scripts/ihk_ioctl_dispatch_check.py --repo "$GITHUB_WORKSPACE"
          MCKERNEL_RUSTC_1_92="$(command -v rustc)" \
            python3 -m unittest -v scripts.tests.test_ihk_ioctl_dispatch_check
          IHK_PAGE_ALLOCATOR_RUSTC="$(command -v rustc)" \
            python3 scripts/ihk_page_allocator_check.py \
              --repo "$GITHUB_WORKSPACE" --require-rustc
          IHK_PAGE_OWNER_REGISTRY_RUSTC="$(command -v rustc)" \
            python3 scripts/ihk_page_owner_registry_check.py \
              --repo "$GITHUB_WORKSPACE" --require-rustc
          python3 scripts/ihk_smp_native_lifecycle_check.py --repo "$GITHUB_WORKSPACE"
          python3 scripts/mcctrl_native_lifecycle_check.py --repo "$GITHUB_WORKSPACE"
          python3 scripts/native_rust_unsafe_ffi_ledger.py --repo "$GITHUB_WORKSPACE" check
          python3 scripts/native_rust_runtime_evidence.py \
            --repo "$GITHUB_WORKSPACE" --check-contract
          python3 scripts/rocky_kernel_rk006_full_source_build_capture.py \
            check-contract --repo "$GITHUB_WORKSPACE"
          python3 -m unittest -v \
            scripts.tests.test_native_rust_kbuild_link_closure \
            scripts.tests.test_native_rust_kconfig_policy \
            scripts.tests.test_native_rust_kconfig_solver \
            scripts.tests.test_native_rust_build_surface_audit \
            scripts.tests.test_rocky_rust_staging \
            scripts.tests.test_native_rust_runtime_evidence \
            scripts.tests.test_native_rust_exact_build_workflow \
            scripts.tests.test_rocky_kernel_rk006_full_source_build_capture \
            scripts.tests.test_ihk_native_lifecycle_check \
            scripts.tests.test_ihk_smp_native_lifecycle_check \
            scripts.tests.test_mcctrl_native_lifecycle_check
          python3 scripts/rs006_miscdevice_substrate.py --repo "$GITHUB_WORKSPACE"
          MCKERNEL_RUSTC_1_92="$(command -v rustc)" \
            python3 -m unittest -v scripts.tests.test_rust_target_compatibility_patches

      - name: Acquire, patch, and credit-forbidden-stage the exact source
        env:
          CACHE_ROOT: ${{ runner.temp }}/native-rust-cache
          SOURCE_ASSETS: ${{ runner.temp }}/native-rust-assets
          SOURCE_PARENT: ${{ runner.temp }}/native-rust-source
        run: |
          set -euo pipefail
          python3 scripts/rocky_kernel_source_lock.py \
            --repo "$GITHUB_WORKSPACE" --cache-root "$CACHE_ROOT" --acquire
          srpm="$(find "$CACHE_ROOT" -type f -name 'kernel-6.12.0-211.44.1.el10_2.src.rpm' -print)"
          test -n "$srpm"
          test "$(printf '%s\n' "$srpm" | wc -l)" = 1
          mkdir -p "$SOURCE_ASSETS" "$SOURCE_PARENT"
          (cd "$SOURCE_ASSETS" && rpm2cpio "$srpm" | cpio -idm --quiet --no-absolute-filenames)
          archive="$SOURCE_ASSETS/linux-6.12.0-211.44.1.el10_2.tar.xz"
          baseline="$SOURCE_ASSETS/kernel-x86_64-rhel.config"
          test -f "$archive"
          test -f "$baseline"
          tar -C "$SOURCE_PARENT" -xf "$archive"
          source_root="$SOURCE_PARENT/linux-6.12.0-211.44.1.el10_2"
          test -f "$source_root/Makefile"
          python3 scripts/rs006_miscdevice_substrate.py \
            --repo "$GITHUB_WORKSPACE" --kernel-source "$source_root" \
            --require-source-replay
          python3 scripts/ihk_ioctl_dispatch_check.py --repo "$GITHUB_WORKSPACE" \
            --kernel-source "$source_root"
          patch -d "$source_root" -p1 --batch --forward --no-backup-if-mismatch \
            -i "$SOURCE_ASSETS/1000-debrand-some-messages.patch"
          for compat_name in \
            0001-x86-rust-set-rustc-abi-x86-softfloat.patch \
            0002-rust-support-rust-1.91-target-spec.patch \
            0003-kbuild-rust-add-rustc-min-version.patch \
            0004-rust-compile-libcore-edition-2024.patch \
            0005-rust-clean-unnecessary-transmutes-lint.patch \
            0006-rust-init-allow-dead-code-rust-1.89.patch \
            0007-rust-use-used-compiler-rust-1.89.patch \
            0008-rust-enable-arbitrary-self-types-rust-1.92.patch \
            0009-rust-block-drop-removed-merge-flag.patch \
            0010-kbuild-disable-default-const-init-unsafe.patch \
            0011-mm-ksm-fix-clang-21-uninitialized.patch \
            0012-netfs-mark-nonstring-lookup-tables.patch \
            0013-lib-crypto-mark-binary-vectors-nonstring.patch \
            0014-gcc-15-mark-byte-arrays-nonstring.patch \
            0015-gcc-15-demote-unterminated-string-warning.patch \
            0016-gcc-15-disable-unterminated-string-warning.patch \
            0017-kbuild-use-cc-disable-warning.patch \
            0018-kbuild-order-unterminated-string-disable.patch \
            0019-rust-types-add-opaque-try-ffi-init.patch \
            0020-rust-miscdevice-add-base-abstraction.patch \
            0021-objtool-recognize-rust-1.92-panic-const.patch \
            0022-x86-pvh-annotate-noendbr.patch \
            0023-rust-update-no-alloc-shim-marker-rust-1.92.patch
          do
            compat_patch="$GITHUB_WORKSPACE/host-kernel/rocky/patches/$compat_name"
            test -s "$compat_patch"
            patch -d "$source_root" -p1 --batch --forward --fuzz=0 --no-backup-if-mismatch \
              -i "$compat_patch"
          done
          patch -d "$source_root" -p1 --batch --forward --fuzz=0 --no-backup-if-mismatch \
            -i "$GITHUB_WORKSPACE/host-kernel/kbuild/patches/0001-drivers-misc-add-mckernel-rust-host-modules.patch"
          patch -d "$source_root" -p1 --batch --forward --fuzz=0 --no-backup-if-mismatch \
            -i "$GITHUB_WORKSPACE/host-kernel/kbuild/patches/0002-rust-bindings-expose-module-parameters.patch"
          python3 scripts/rocky_rust_staging.py --repo "$GITHUB_WORKSPACE" \
            --stage-for-evidence "$source_root"
          python3 scripts/rocky_rust_staging.py --repo "$GITHUB_WORKSPACE" \
            --verify-evidence-stage "$source_root"
          printf 'NATIVE_SRPM=%s\n' "$srpm" >> "$GITHUB_ENV"
          printf 'NATIVE_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          printf 'NATIVE_BASELINE_CONFIG=%s\n' "$baseline" >> "$GITHUB_ENV"

      - name: Resolve the evidence-only module configuration twice
        env:
          BUILD_DIR: ${{ runner.temp }}/native-rust-build
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          cp "$NATIVE_BASELINE_CONFIG" "$BUILD_DIR/.config"
          "$NATIVE_SOURCE_ROOT/scripts/kconfig/merge_config.sh" -m -O "$BUILD_DIR" \
            "$BUILD_DIR/.config" \
            "$GITHUB_WORKSPACE/host-kernel/rocky/configs/rust-minimal.config" \
            "$GITHUB_WORKSPACE/host-kernel/rocky/configs/native-rust-evidence.config"
          make -C "$NATIVE_SOURCE_ROOT" O="$BUILD_DIR" ARCH=x86_64 LLVM=1 olddefconfig
          cp "$BUILD_DIR/.config" "$BUILD_DIR/resolved-first.config"
          make -C "$NATIVE_SOURCE_ROOT" O="$BUILD_DIR" ARCH=x86_64 LLVM=1 olddefconfig
          cmp "$BUILD_DIR/resolved-first.config" "$BUILD_DIR/.config"
          grep -qx 'CONFIG_WERROR=y' "$BUILD_DIR/.config"
          grep -qx 'CONFIG_MODULES=y' "$BUILD_DIR/.config"
          for symbol in \
            CONFIG_MCKERNEL_IHK_RUST \
            CONFIG_MCKERNEL_IHK_SMP_X86_64_RUST \
            CONFIG_MCKERNEL_MCCTRL_RUST; do
            grep -qx "$symbol=m" "$BUILD_DIR/.config"
          done
          EVIDENCE_DIR="$RUNNER_TEMP/native-rust-build-evidence"
          MATRIX_DIR="$RUNNER_TEMP/native-rust-kconfig-matrix"
          mkdir -p "$EVIDENCE_DIR"
          test ! -e "$MATRIX_DIR"
          python3 scripts/native_rust_kconfig_solver.py run \
            --source "$NATIVE_SOURCE_ROOT" \
            --seed "$BUILD_DIR/.config" \
            --matrix-dir "$MATRIX_DIR"
          cp "$MATRIX_DIR/kconfig-solver-matrix.json" \
            "$EVIDENCE_DIR/kconfig-solver-matrix.json"
          chmod 0644 "$EVIDENCE_DIR/kconfig-solver-matrix.json"
          python3 scripts/native_rust_kconfig_solver.py check \
            --matrix "$EVIDENCE_DIR/kconfig-solver-matrix.json" \
            --source "$NATIVE_SOURCE_ROOT" \
            --seed "$BUILD_DIR/.config"
          printf 'NATIVE_BUILD_DIR=%s\n' "$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Compile the exact kernel and native Rust modules
        run: |
          set -uo pipefail
          evidence_dir="$RUNNER_TEMP/native-rust-build-evidence"
          mkdir -p "$evidence_dir"
          module_targets=(
            drivers/misc/mckernel/ihk.ko
            drivers/misc/mckernel/ihk-smp-x86_64.ko
            drivers/misc/mckernel/mcctrl.ko
          )
          printf '%s\n' "${module_targets[@]}" > "$evidence_dir/module-targets.txt"
          : > "$evidence_dir/build.commands"
          printf '%s\n' not-started > "$evidence_dir/build.phase"

          run_phase() {
            local phase="$1"
            shift
            local -a command=("$@")
            printf '%s\n' "$phase" > "$evidence_dir/build.phase"
            printf '%q' "${command[0]}" >> "$evidence_dir/build.commands"
            printf ' %q' "${command[@]:1}" >> "$evidence_dir/build.commands"
            printf '\n' >> "$evidence_dir/build.commands"
            "${command[@]}"
          }

          set +e
          (
            set -e
            run_phase rustavailable \
              make -C "$NATIVE_SOURCE_ROOT" O="$NATIVE_BUILD_DIR" \
                ARCH=x86_64 LLVM=1 rustavailable
            run_phase bzImage \
              make -C "$NATIVE_SOURCE_ROOT" O="$NATIVE_BUILD_DIR" \
                ARCH=x86_64 LLVM=1 -j2 bzImage
            # Linux 6.12 supports in-tree %.ko single targets.  Build the exact
            # boot kernel first so their modpost pass consumes its vmlinux.o
            # symbol universe.  Keep all three module targets in one invocation
            # so modpost also sees the complete ihk provider/consumer graph.
            run_phase native-modules \
              make -C "$NATIVE_SOURCE_ROOT" O="$NATIVE_BUILD_DIR" \
                ARCH=x86_64 LLVM=1 -j2 "${module_targets[@]}"
            printf '%s\n' complete > "$evidence_dir/build.phase"
          ) 2>&1 | tee "$evidence_dir/build.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          producer_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          printf '%s\n' "$producer_status" > "$evidence_dir/build.exit-code"
          printf '%s\n' "$tee_status" > "$evidence_dir/build-log.exit-code"
          if (( producer_status != 0 )); then
            exit "$producer_status"
          fi
          exit "$tee_status"

      - name: Validate built metadata and capture immutable diagnostics
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/native-rust-build-evidence"
          module_root="$NATIVE_BUILD_DIR/drivers/misc/mckernel"
          ihk="$module_root/ihk.ko"
          smp="$module_root/ihk-smp-x86_64.ko"
          mcctrl="$module_root/mcctrl.ko"
          test -s "$ihk"
          test -s "$smp"
          test -s "$mcctrl"
          (
            cd "$NATIVE_BUILD_DIR"
            find . -type f -name '*.ko' -printf '%P\n' | LC_ALL=C sort
          ) > "$EVIDENCE_DIR/built-module-artifacts.txt"
          LC_ALL=C sort "$EVIDENCE_DIR/module-targets.txt" \
            > "$EVIDENCE_DIR/module-targets.sorted"
          cmp "$EVIDENCE_DIR/module-targets.sorted" \
            "$EVIDENCE_DIR/built-module-artifacts.txt"
          rm "$EVIDENCE_DIR/module-targets.sorted"
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD \
            > "$EVIDENCE_DIR/commit.sha"
          # Preserve the exact binaries and both rendered and raw module
          # metadata before any semantic checker can fail closed.
          for module in "$ihk" "$smp" "$mcctrl"; do
            name="$(basename "$module")"
            cp "$module" "$EVIDENCE_DIR/$name"
            modinfo "$module" > "$EVIDENCE_DIR/$name.modinfo"
            readelf -p .modinfo "$module" > "$EVIDENCE_DIR/$name.modinfo-section"
            readelf -SWr "$module" > "$EVIDENCE_DIR/$name.readelf"
            nm -A -a "$module" > "$EVIDENCE_DIR/$name.nm"
          done
          (
            cd "$EVIDENCE_DIR"
            find . -maxdepth 1 -type f \
              ! -name PRECHECK_SHA256SUMS ! -name SHA256SUMS -printf '%P\0' \
              | sort -z | xargs -0 sha256sum -- > PRECHECK_SHA256SUMS
            sha256sum --check --strict PRECHECK_SHA256SUMS
          )
          python3 scripts/ihk_native_lifecycle_check.py --repo "$GITHUB_WORKSPACE" --module "$ihk"
          python3 scripts/ihk_os_registry_check.py --repo "$GITHUB_WORKSPACE"
          test "$(rustc --version | awk '{print $2}')" = "1.92.0"
          MCKERNEL_RUSTC_1_92="$(command -v rustc)" \
            python3 -m unittest -v scripts.tests.test_ihk_os_registry_check
          python3 scripts/ihk_ioctl_dispatch_check.py --repo "$GITHUB_WORKSPACE"
          MCKERNEL_RUSTC_1_92="$(command -v rustc)" \
            python3 -m unittest -v scripts.tests.test_ihk_ioctl_dispatch_check
          python3 scripts/ihk_smp_native_lifecycle_check.py --repo "$GITHUB_WORKSPACE" --module "$smp"
          python3 scripts/mcctrl_native_lifecycle_check.py --repo "$GITHUB_WORKSPACE" --module "$mcctrl"
          cp "$NATIVE_BUILD_DIR/.config" "$EVIDENCE_DIR/resolved.config"
          cp "$NATIVE_BUILD_DIR/arch/x86/boot/bzImage" "$EVIDENCE_DIR/bzImage"
          cp "$NATIVE_SOURCE_ROOT/drivers/misc/mckernel/stage-lock.json" "$EVIDENCE_DIR/stage-lock.json"
          make -s -C "$NATIVE_SOURCE_ROOT" O="$NATIVE_BUILD_DIR" ARCH=x86_64 LLVM=1 \
            kernelrelease > "$EVIDENCE_DIR/kernel.release"
          cmd_records=(
            .ihk-smp-x86_64.ko.cmd
            .ihk-smp-x86_64.mod.cmd
            .ihk-smp-x86_64.mod.o.cmd
            .ihk-smp-x86_64.o.cmd
            .ihk.ko.cmd
            .ihk.mod.cmd
            .ihk.mod.o.cmd
            .ihk.o.cmd
            .ihk_smp_x86_64.o.cmd
            .mcctrl.ko.cmd
            .mcctrl.mod.cmd
            .mcctrl.mod.o.cmd
            .mcctrl.o.cmd
          )
          mod_records=(ihk-smp-x86_64.mod ihk.mod mcctrl.mod)
          for record in "${cmd_records[@]}" "${mod_records[@]}"; do
            test -f "$module_root/$record"
            test ! -L "$module_root/$record"
            cp "$module_root/$record" "$EVIDENCE_DIR/$record"
          done
          python3 scripts/native_rust_kbuild_link_closure.py \
            --records-dir "$EVIDENCE_DIR" \
            --stage-lock "$EVIDENCE_DIR/stage-lock.json" \
            --output "$EVIDENCE_DIR/kbuild-link-closure.json"
          python3 scripts/native_rust_kbuild_link_closure.py \
            --records-dir "$EVIDENCE_DIR" \
            --stage-lock "$EVIDENCE_DIR/stage-lock.json" \
            --check-output "$EVIDENCE_DIR/kbuild-link-closure.json"
          (
            cd "$EVIDENCE_DIR"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z | xargs -0 sha256sum -- > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload compiler evidence or first-failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rust-exact-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-rust-build-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

  fp0006-native-rust-capture:
    name: Capture FP-0006 native Rust fixture (credit forbidden)
    needs: exact-build
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176
    defaults:
      run:
        shell: bash

    steps:
      - name: Install pinned Rust and identify the observed FP-0006 linker
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = rocky
          test "$VERSION_ID" = 10.2
          dnf -y --setopt=install_weak_deps=False install \
            coreutils gcc git-core python3 rust-1.92.0-1.el10
          test "$(command -v rustc)" = /usr/bin/rustc
          test "$(command -v gcc)" = /usr/bin/gcc
          test "$(command -v timeout)" = /usr/bin/timeout
          test ! -L /usr/bin/rustc
          test ! -L /usr/bin/gcc
          test ! -L /usr/bin/timeout
          test "$(/usr/bin/rpm -qf --qf '%{NAME}\n' /usr/bin/rustc)" = rust
          test "$(/usr/bin/rpm -qf --qf '%{NAME}\n' /usr/bin/gcc)" = gcc
          test "$(/usr/bin/rpm -qf --qf '%{NAME}\n' /usr/bin/timeout)" = coreutils
          test "$(/usr/bin/rpm -q --qf '%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' rust)" = rust-0:1.92.0-1.el10.x86_64
          test "$(/usr/bin/rustc --version)" = 'rustc 1.92.0 (ded5c06cf 2025-12-08) (Red Hat 1.92.0-1.el10)'
          /usr/bin/rustc -Vv
          /usr/bin/gcc --version
          dnf clean all

      - name: Check out the exact FP-0006 candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Produce and review the FP-0006 native envelope
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 scripts/fp0006_runtime_capture_integration.py check-contract \
            --repo "$GITHUB_WORKSPACE"
          stage="$RUNNER_TEMP/fp0006-native-rust-stage"
          output="$RUNNER_TEMP/fp0006-native-rust-capture"
          producer="$RUNNER_TEMP/fp0006-native-rust-producer"
          producer_output="$RUNNER_TEMP/fp0006-native-rust-producer-output.log"
          producer_log="$RUNNER_TEMP/fp0006-native-rust-producer.log"
          compiler_output="$RUNNER_TEMP/fp0006-native-rust-compiler.log"
          tool_report="$RUNNER_TEMP/fp0006-native-rust-tools.txt"
          base_sha=none
          base_sha_json=null
          workflow_candidate_aligned=false
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
            base_sha_json="\"$base_sha\""
          fi
          if test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA" && \
            test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_HEAD_SHA"
          then
            workflow_candidate_aligned=true
          fi
          test ! -e "$stage"
          test ! -e "$output"
          mkdir -m 700 "$stage"
          : > "$producer_output"
          : > "$compiler_output"
          {
            /usr/bin/rpm -q --qf '%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' rust gcc coreutils
            /usr/bin/sha256sum /usr/bin/rustc /usr/bin/gcc /usr/bin/timeout
            /usr/bin/rustc -Vv
            /usr/bin/gcc --version
            /usr/bin/timeout --version
          } > "$tool_report"
          compile_rc=0
          if /usr/bin/env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            /usr/bin/rustc --edition=2021 -D warnings -C linker=/usr/bin/gcc \
            scripts/tests/fixtures/ihk_ioctl_fp0006_negative_dispatch.rs \
            -o "$producer" > "$compiler_output" 2>&1
          then
            compile_rc=0
          else
            compile_rc=$?
          fi
          if test "$compile_rc" -ne 0; then
            cat "$compiler_output" >&2
            exit "$compile_rc"
          fi
          if test -s "$compiler_output"; then
            cat "$compiler_output" >&2
            exit 1
          fi
          binary_sha256="$(/usr/bin/sha256sum "$producer" | /usr/bin/awk '{ print $1 }')"
          tool_report_sha256="$(/usr/bin/sha256sum "$tool_report" | /usr/bin/awk '{ print $1 }')"
          printf '{"base_sha":%s,"binary_sha256":"%s","event":"producer-start","event_name":"%s","github_sha":"%s","head_sha":"%s","linker":"/usr/bin/gcc","normalized_command":["/usr/bin/env","-i","HOME=/nonexistent","LANG=C","LC_ALL=C","PATH=/usr/bin:/bin","/usr/bin/timeout","--signal=TERM","--kill-after=5s","30s","<producer-by-sha256>","<capture-stage>"],"ref":"%s","repository":"%s","run_attempt":%s,"run_id":%s,"surface":"native-rust-source-fixture","timeout_seconds":30,"tool_report_sha256":"%s","workflow_candidate_aligned":%s,"workflow_sha":"%s"}\n' \
            "$base_sha_json" "$binary_sha256" "$GITHUB_EVENT_NAME" \
            "$GITHUB_SHA" "$EXPECTED_HEAD_SHA" "$GITHUB_REF" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ID" \
            "$tool_report_sha256" "$workflow_candidate_aligned" \
            "$GITHUB_WORKFLOW_SHA" \
            > "$producer_log"
          capture_rc=0
          if /usr/bin/env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=5s 30s \
            "$producer" "$stage" > "$producer_output" 2>&1
          then
            capture_rc=0
          else
            capture_rc=$?
          fi
          {
            printf '{"event":"producer-output","output_bytes":%s,"output_sha256":"%s","surface":"native-rust-source-fixture"}\n' \
              "$(/usr/bin/wc -c < "$producer_output")" \
              "$(/usr/bin/sha256sum "$producer_output" | /usr/bin/awk '{ print $1 }')"
            printf '{"event":"producer-exit","status":%s,"surface":"native-rust-source-fixture"}\n' \
              "$capture_rc"
          } >> "$producer_log"
          test "$capture_rc" = 0
          test ! -s "$producer_output"
          python3 scripts/fp0006_runtime_capture_integration.py finalize-lane \
            --repo "$GITHUB_WORKSPACE" \
            --capture-dir "$stage" \
            --producer-output "$producer_output" \
            --producer-log "$producer_log" \
            --producer-binary "$producer" \
            --tool-report "$tool_report" \
            --compiler-output "$compiler_output" \
            --output-dir "$output" \
            --surface native-rust-source-fixture \
            --head "$EXPECTED_HEAD_SHA" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-event-name "$GITHUB_EVENT_NAME" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --github-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --github-base-sha "$base_sha"

      - name: Upload FP-0006 native envelope
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fp0006-native-rust-source-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fp0006-native-rust-capture/fp0006-runtime-capture-v1.tar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  rk006-full-source-build-capture:
    name: Bind RK-006 full-source replay to the exact build (credit forbidden)
    needs: exact-build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176
    defaults:
      run:
        shell: bash

    steps:
      - name: Initialize non-durable capture and install exact tools
        run: |
          set -euo pipefail
          capture_dir="$RUNNER_TEMP/rk006-full-source-build-capture"
          mkdir -p "$capture_dir"
          printf '%s\n' bootstrap-started > "$capture_dir/workflow-state"
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = rocky
          test "$VERSION_ID" = 10.2
          dnf -y --setopt=install_weak_deps=False install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y --setopt=install_weak_deps=False install \
            bc binutils bison bindgen-cli bpftool cargo clang cpio diffutils \
            dwarves elfutils-libelf-devel findutils flex gcc git-core gzip \
            hostname kernel-rpm-macros kmod lld llvm llvm-devel make ncurses-devel \
            openssl openssl-devel patch perl python3 python3-devel python3-pyyaml \
            redhat-rpm-config rpm-build rust rust-src rustfmt tar which xz zstd
          dnf clean all

      - name: Check out the exact capture candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify the frozen non-crediting RK-006 capture contract
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 scripts/rocky_kernel_rk006_full_source_build_capture.py \
            check-contract --repo "$GITHUB_WORKSPACE"
          python3 -m unittest -v \
            scripts.tests.test_rocky_kernel_rk006_patch_authority \
            scripts.tests.test_rocky_kernel_rk006_full_source_build_capture

      - name: Reacquire and capture the full external 25-patch source replay
        env:
          CACHE_ROOT: ${{ runner.temp }}/rk006-source-cache
          SOURCE_ASSETS: ${{ runner.temp }}/rk006-source-assets
          SOURCE_PARENT: ${{ runner.temp }}/rk006-source
        run: |
          set -euo pipefail
          python3 scripts/rocky_kernel_source_lock.py \
            --repo "$GITHUB_WORKSPACE" --cache-root "$CACHE_ROOT" --acquire
          srpm="$(find "$CACHE_ROOT" -type f -name 'kernel-6.12.0-211.44.1.el10_2.src.rpm' -print)"
          test -n "$srpm"
          test "$(printf '%s\n' "$srpm" | wc -l)" = 1
          mkdir -p "$SOURCE_ASSETS" "$SOURCE_PARENT"
          (cd "$SOURCE_ASSETS" && rpm2cpio "$srpm" | cpio -idm --quiet --no-absolute-filenames)
          archive="$SOURCE_ASSETS/linux-6.12.0-211.44.1.el10_2.tar.xz"
          vendor_patch="$SOURCE_ASSETS/1000-debrand-some-messages.patch"
          test -f "$archive"
          test -f "$vendor_patch"
          source_root="$SOURCE_PARENT/linux-6.12.0-211.44.1.el10_2"
          test ! -e "$source_root"
          python3 scripts/rocky_kernel_rk006_full_source_build_capture.py capture \
            --repo "$GITHUB_WORKSPACE" \
            --source-root "$source_root" \
            --source-archive "$archive" \
            --source-rpm "$srpm" \
            --vendor-patch "$vendor_patch" \
            --output-dir "$RUNNER_TEMP/rk006-full-source-build-capture" \
            --github-head-sha "$EXPECTED_HEAD_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-repository "$GITHUB_REPOSITORY" \
            --container-image "$ROCKY_IMAGE"

      - name: Download the same-run exact-build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-rust-exact-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rk006-build-evidence

      - name: Finalize the non-crediting build binding
        run: |
          set -euo pipefail
          python3 scripts/rocky_kernel_rk006_full_source_build_capture.py \
            finalize-build \
            --repo "$GITHUB_WORKSPACE" \
            --capture-dir "$RUNNER_TEMP/rk006-full-source-build-capture" \
            --build-evidence-dir "$RUNNER_TEMP/rk006-build-evidence"
          python3 scripts/rocky_kernel_rk006_full_source_build_capture.py \
            verify-capture \
            --repo "$GITHUB_WORKSPACE" \
            --capture-dir "$RUNNER_TEMP/rk006-full-source-build-capture"

      - name: Upload RK-006 capture or first-failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rk006-full-source-build-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rk006-full-source-build-capture/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true
