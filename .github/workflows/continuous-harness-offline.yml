name: Continuous harness offline qualification
on:
  push:
    branches: ['codex/continuous-harness-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            .github
            docs/development
          submodules: false
          lfs: false
      - name: Read the committed original closure tracker
        run: |
          mkdir -p docs/verification
          git show HEAD:docs/verification/m14-m15-closure-progress.json > docs/verification/m14-m15-closure-progress.json
      - name: Functional harness fake transport tests
        env:
          PYTHONPATH: scripts:scripts/tests
        run: |
          python3 -m unittest \
            scripts.tests.test_os_goal_launcher \
            scripts.tests.test_os_goal_continuous \
            scripts.tests.test_os_goal_continuous_eligibility \
            scripts.tests.test_os_goal_continuous_launch \
            scripts.tests.test_os_goal_owner_retention \
            scripts.tests.test_os_goal_custody \
            scripts.tests.test_os_goal_watcher_retention \
            scripts.tests.test_os_goal_resources \
            scripts.tests.test_os_goal_repair \
            scripts.tests.test_os_goal_source_work \
            scripts.tests.test_os_goal_source_work_bridge \
            scripts.tests.test_os_goal_credit_timeout \
            scripts.tests.test_os_goal_recovery \
            scripts.tests.test_os_goal_timeout_recovery \
            scripts.tests.test_os_goal_queue \
            scripts.tests.test_os_goal_instructions \
            scripts.tests.test_os_goal_capture_progress \
            scripts.tests.test_os_goal_mailbox \
            scripts.tests.test_os_goal_mailbox_protocol \
            scripts.tests.test_os_goal_mailbox_status \
            scripts.tests.test_os_goal_mailbox_workflow \
            scripts.tests.test_os_goal_file_mailbox \
            scripts.tests.test_os_goal_status_feed \
            scripts.tests.test_send_os_goal_message
