name: IHK exact affected16 source qualification
on:
  push:
    branches: [codex/ihk-affected16-qualification-20261114]
permissions:
  contents: read
jobs:
  affected:
    name: Reviewed IHK affected16 outer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LANG: C
      LC_ALL: C
    steps:
      - name: Check out immutable reviewed source candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c1388ca7c0c94dd7c57513f593e3782b19a1f19d
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /kernel/
            /arch/
            /lib/
            /scripts/
            /host-kernel/
            /cmake/
            /executer/
            /ihk/
            /instructions/
            /config/
            /CMakeLists.txt
            /config.h.in
            /.gitmodules
            /AGENTS.md
            /CAMPAIGN.md
            /docs/development/
      - name: Verify immutable source and exact reviewed adapter fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ihk-affected-output"
          test "$(git rev-parse HEAD)" = 'c1388ca7c0c94dd7c57513f593e3782b19a1f19d'
          test "$(git rev-parse 'HEAD^{tree}')" = '87b385838f17bb0ac0134c03bffb3107cb8343ca'
          test "$(git rev-parse HEAD:ihk)" = '9f1d0170ba199eb1a477f1ed85de44442f985cd1'
          test ! -e ihk/.git
          git rev-parse HEAD 'HEAD^{tree}' HEAD:ihk > "$RUNNER_TEMP/ihk-affected-output/source-identity.txt"
          sha256sum --check > "$RUNNER_TEMP/ihk-affected-output/source-pins.txt" <<'PINS'
          49e67027b5dc976d06288855a89084297cdda997171993d4514cf4345170986c  .github/workflows/native-rust-host-modules-exact-build.yml
          ce33ecae2f5a166ce7c91f7cf864a25ca567d113001fa71f91e1d9dfb8496372  .gitmodules
          e3080b55b8e69b1f4a636d754f6a47a5ae592abd63f06948082f23dc08064c08  CMakeLists.txt
          ac793a4062b2d3142c48c07348adac3014968e25af6cbe204aea4d41852313b1  ihk/CMakeLists.txt
          3130bba0e9931580c8e60f62c2e3b250b8e0e7158ead91a3c010c7e9c5407410  ihk/VENDORED-REVISION
          548ef6bf5466dd20859a3bf788196dc3efdc9660b20326814bc3904d2b507f80  scripts/host_module_inventory.py
          f90552b6997d03dd1e791c46af7aae0e6f936fcf3dcd0279e4d05a08499bc5f9  scripts/ihk_device_registry_check.py
          76343771ae7376e70169b633ffbab800f807c636d4c57a54af3f42731524e02e  scripts/ihk_ioctl_dispatch_check.py
          9772e1f6ad6783130f3a8e88aad9fd93cd9046a502d7a30504db815ad4ba59f6  scripts/ihk_os_registry_check.py
          29b2394b7855496fa7005afa003b120bd4073dad7f4aa070c082271084e18077  scripts/ihk_source_layout.py
          2799d15526954d678a3fe71b8065dac602147904ed215e77362a2da3930ccd4e  scripts/linux_api_needs.py
          0146487f63bb18ccb1991193e2790f4aac602f400b69558162b041e04ab50153  scripts/native_rust_exact_build_container_owner.py
          b450d87e3622b3a806b130de37a90e50fd41f5ced4a55b81af1822edfd16116f  scripts/native_rust_exact_build_input_manifest.py
          45d7d4d4ad27089499164c11f5a067b474893a743f1243ea0602df0ccb0e56a8  scripts/native_rust_exact_build_offline.py
          5c61abf496991b398387f5bf967afb133b7da925f62e4adead5f0dc46e62970d  scripts/native_rust_exact_mckernel_image_container_owner.py
          83501ae145a609e7ef087e1529f5f4723e11a6e6b0f6fb65c9e1c70e18f8dc35  scripts/native_rust_exact_mckernel_image_offline.py
          604a7ea4807038ddea88dd0b1af797bcd9612513905ed4f119787b07fe5062f8  scripts/native_rust_kbuild_link_closure.py
          72aca7173cb59b42ba40a5b4421314cb6221414df645495545ca767a4a858161  scripts/restore_ihk_source.py
          e22221422d5cef408a258a21c8e6ca3d7b67dadbcc80750b505d65e6a1e971ce  scripts/rocky_rust_staging.py
          c6dcce5d5dca53007836b5b033dfccf2917445bc160e82f15b0ec9dfc095fd2f  scripts/tests/test_native_rust_exact_build_offline.py
          b46b4dd67eeb0b68db31235acd2d5995c7b0f38971a6a69e4deca31a1c068499  scripts/tests/test_native_rust_exact_build_workflow.py
          30f346a323975b89c41a229b51c15f82a2249b2c6ff8b50a2522bf7416035054  scripts/tests/test_restore_ihk_source.py
          5b1a7f3a85e94555a1449d3260424e257a3028faed72e6bbe2a3b9cbcffa06a3  scripts/tests/test_rocky_rust_staging.py
          PINS
          /usr/bin/python3 -E -s scripts/ihk_source_layout.py --repo "$GITHUB_WORKSPACE" --expect 8d288b8bd81b50cc3a3f814d949b89bf416a6ec7 > "$RUNNER_TEMP/ihk-affected-output/layout.txt"
          cat "$RUNNER_TEMP/ihk-affected-output/source-pins.txt"
          cat "$RUNNER_TEMP/ihk-affected-output/layout.txt"
      - name: Reuse pinned historical source transport outside ordinary IHK tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin f2eb735212e6ab0494e638497e80d9ae78b2848e
          git cat-file -e 'f2eb735212e6ab0494e638497e80d9ae78b2848e^{commit}'
          /usr/bin/python3 -E -s scripts/restore_ihk_source.py --repo "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/ihk-history" > "$RUNNER_TEMP/ihk-affected-output/history-restore.stdout" 2> "$RUNNER_TEMP/ihk-affected-output/history-restore.stderr"
          test "$(git -C "$RUNNER_TEMP/ihk-history" rev-parse HEAD)" = '8d288b8bd81b50cc3a3f814d949b89bf416a6ec7'
          test "$(git -C "$RUNNER_TEMP/ihk-history" rev-parse --show-toplevel)" = "$RUNNER_TEMP/ihk-history"
          git -C "$RUNNER_TEMP/ihk-history" show 8d288b8bd81b50cc3a3f814d949b89bf416a6ec7:CMakeLists.txt > "$RUNNER_TEMP/ihk-history-CMakeLists.txt"
          test "$(sha256sum "$RUNNER_TEMP/ihk-history-CMakeLists.txt" | cut -d ' ' -f 1)" = '7d91805dac7ed1fb0514e536383dd6cde43b91fe8b4114fe6ed00ba3e4b0e65d'
          git -C "$RUNNER_TEMP/ihk-history" rev-parse HEAD --show-toplevel > "$RUNNER_TEMP/ihk-affected-output/history-identity.txt"
          sha256sum "$RUNNER_TEMP/ihk-history-CMakeLists.txt" >> "$RUNNER_TEMP/ihk-affected-output/history-identity.txt"
          echo "MCKERNEL_IHK_HISTORY=$RUNNER_TEMP/ihk-history" >> "$GITHUB_ENV"
          /usr/bin/python3 -c 'import yaml; print("PyYAML " + yaml.__version__)'
          { /usr/bin/python3 --version; git --version; } > "$RUNNER_TEMP/ihk-affected-output/toolchain.txt"
          cat "$RUNNER_TEMP/ihk-affected-output/history-restore.stdout"
          cat "$RUNNER_TEMP/ihk-affected-output/history-restore.stderr" >&2
          cat "$RUNNER_TEMP/ihk-affected-output/history-identity.txt"
      - name: Command1 exact10 reviewed IHK adapter selectors
        shell: bash
        run: |
          set +e
          set -uo pipefail
          /usr/bin/python3 -B -m unittest -v scripts.tests.test_native_rust_exact_build_offline.DriverTests.test_positive_all_five_phases_and_inventory scripts.tests.test_native_rust_exact_build_offline.DriverTests.test_head_submodule_and_dirty_mutations scripts.tests.test_native_rust_exact_build_offline.DriverTests.test_input_mutation_and_incomplete_inventory_reject scripts.tests.test_restore_ihk_source.RestoreIhkSourceTests.test_reconstructs_from_committed_blobs_and_empty_destination scripts.tests.test_restore_ihk_source.RestoreIhkSourceTests.test_exact_clean_checkout_is_unchanged_noop scripts.tests.test_restore_ihk_source.RestoreIhkSourceTests.test_manifest_hash_and_gitlink_bindings_reject_changes scripts.tests.test_rocky_rust_staging.RockyRustStagingTests.test_generated_identity_reproduces_unchanged_ihk_consumer_git_rule scripts.tests.test_rocky_rust_staging.RockyRustStagingTests.test_generated_identity_uses_consumer_version_for_source_archive scripts.tests.test_rocky_rust_staging.RockyRustStagingTests.test_generated_identity_rejects_unreviewed_consumer_rule scripts.tests.test_native_rust_exact_build_workflow.NativeRustExactBuildWorkflowTests.test_frozen_legacy_oracle_and_shared_evidence_path_are_available > "$RUNNER_TEMP/ihk-affected-output/command-1.stdout" 2> "$RUNNER_TEMP/ihk-affected-output/command-1.stderr"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/ihk-affected-output/command-1.exit"
          cat "$RUNNER_TEMP/ihk-affected-output/command-1.stdout"
          cat "$RUNNER_TEMP/ihk-affected-output/command-1.stderr" >&2
          test "$status" = 0 || exit "$status"
          grep -Eq '^Ran 10 tests in [0-9.]+s$' "$RUNNER_TEMP/ihk-affected-output/command-1.stderr" || exit 1
          test "$(tail -n 1 "$RUNNER_TEMP/ihk-affected-output/command-1.stderr")" = OK || exit 1
      - name: Command2 exact5 reviewed IHK adapter selectors
        shell: bash
        run: |
          set +e
          set -uo pipefail
          /usr/bin/python3 -B -m unittest -v scripts.tests.test_host_module_inventory.FrozenInventoryTests.test_complete_frozen_v1_render_matches_unchanged_golden scripts.tests.test_linux_api_needs.GoldenManifestTests.test_generated_manifest_is_complete_and_current scripts.tests.test_ihk_device_registry_check.IhkDeviceRegistryContractTests.test_repository_contract_is_todo_noncrediting_and_exact scripts.tests.test_ihk_os_registry_check.IhkOsRegistryContractTests.test_repository_contract_is_todo_and_fail_closed scripts.tests.test_ihk_ioctl_dispatch_check.IhkIoctlDispatchContractTests.test_repository_contract_is_todo_and_registration_blocked > "$RUNNER_TEMP/ihk-affected-output/command-2.stdout" 2> "$RUNNER_TEMP/ihk-affected-output/command-2.stderr"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/ihk-affected-output/command-2.exit"
          cat "$RUNNER_TEMP/ihk-affected-output/command-2.stdout"
          cat "$RUNNER_TEMP/ihk-affected-output/command-2.stderr" >&2
          test "$status" = 0 || exit "$status"
          grep -Eq '^Ran 5 tests in [0-9.]+s$' "$RUNNER_TEMP/ihk-affected-output/command-2.stderr" || exit 1
          test "$(tail -n 1 "$RUNNER_TEMP/ihk-affected-output/command-2.stderr")" = OK || exit 1
      - name: Command3 exact1 reviewed image driver pin selector
        shell: bash
        run: |
          set +e
          set -uo pipefail
          /usr/bin/python3 -B -m unittest -v scripts.tests.test_native_rust_exact_mckernel_image_container_owner.DriverReleasePinTests.test_release_pin_matches_current_offline_driver > "$RUNNER_TEMP/ihk-affected-output/command-3.stdout" 2> "$RUNNER_TEMP/ihk-affected-output/command-3.stderr"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/ihk-affected-output/command-3.exit"
          cat "$RUNNER_TEMP/ihk-affected-output/command-3.stdout"
          cat "$RUNNER_TEMP/ihk-affected-output/command-3.stderr" >&2
          test "$status" = 0 || exit "$status"
          grep -Eq '^Ran 1 test in [0-9.]+s$' "$RUNNER_TEMP/ihk-affected-output/command-3.stderr" || exit 1
          test "$(tail -n 1 "$RUNNER_TEMP/ihk-affected-output/command-3.stderr")" = OK || exit 1
      - name: Preserve complete original affected selector captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ihk-exact-affected16
          path: ${{ runner.temp }}/ihk-affected-output/
          if-no-files-found: error
          retention-days: 14
