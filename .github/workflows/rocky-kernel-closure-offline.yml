name: Rocky 10.2 complete RPM closure and offline replay

on:
  workflow_dispatch:
    inputs:
      validation_sha:
        description: Exact 40-hex candidate commit
        required: true
        type: string
  push:
    branches: [codex/rocky-rust-validation]
    paths:
      - .github/workflows/rocky-kernel-closure-offline.yml
      - .github/workflows/rocky-kernel-platform-evidence.yml
      - host-kernel/rocky/**
      - scripts/rocky_kernel_closure_offline.py
      - scripts/rocky_kernel_platform_evidence.py
      - scripts/rocky_kernel_platform_lock.py
      - scripts/rocky_kernel_source_lock.py
      - scripts/tests/test_rocky_kernel_closure_offline.py
  pull_request:
    branches: [development]
    paths:
      - .github/workflows/rocky-kernel-closure-offline.yml
      - .github/workflows/rocky-kernel-platform-evidence.yml
      - host-kernel/rocky/**
      - scripts/rocky_kernel_closure_offline.py
      - scripts/rocky_kernel_platform_evidence.py
      - scripts/rocky_kernel_platform_lock.py
      - scripts/rocky_kernel_source_lock.py
      - scripts/tests/test_rocky_kernel_closure_offline.py

permissions:
  contents: read

env:
  RK_PLATFORM_CONTAINER_IMAGE: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176
  EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  closure-offline:
    name: Complete signed closure and offline probes (credit forbidden)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the bootstrap contract at the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Install the checksum-locked bootstrap with repositories disabled
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/rk003-closure-offline-evidence
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = rocky
          test "$VERSION_ID" = 10.2
          test ! -e "$EVIDENCE_ROOT"
          test ! -L "$EVIDENCE_ROOT"
          mkdir -m 700 "$EVIDENCE_ROOT"
          python3 scripts/rocky_kernel_platform_evidence.py \
            --repo "$GITHUB_WORKSPACE" \
            --bootstrap \
            --output-dir "$EVIDENCE_ROOT/bootstrap" \
            --github-head-sha "$EXPECTED_HEAD_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-repository "$GITHUB_REPOSITORY" \
            --container-image "$RK_PLATFORM_CONTAINER_IMAGE"
          (cd "$EVIDENCE_ROOT/bootstrap" && sha256sum --check --strict SHA256SUMS)

      - name: Re-check out the exact candidate with pinned Git
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: true

      - name: Verify bounded contracts and focused tests without gate credit
        run: |
          set -euo pipefail
          canonical_workspace="$(python3 -c \
            'import os, sys; print(os.path.realpath(sys.argv[1]))' \
            "$GITHUB_WORKSPACE")"
          test -n "$canonical_workspace"
          test "$(git -c "safe.directory=$canonical_workspace" \
            -C "$canonical_workspace" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          for tool in chroot dnf git gpg gpgv python3 readlink rpm rpmkeys rpmspec sha256sum zstd; do
            command -v "$tool" >/dev/null
          done
          python3 scripts/rocky_kernel_platform_evidence.py \
            --repo "$GITHUB_WORKSPACE" \
            --check
          python3 scripts/rocky_kernel_closure_offline.py \
            --repo "$GITHUB_WORKSPACE" \
            --check
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            scripts.tests.test_rocky_kernel_closure_offline

      - name: Reproduce signed repository-direct inputs
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/rk003-closure-offline-evidence
        run: |
          set -euo pipefail
          python3 scripts/rocky_kernel_platform_evidence.py \
            --repo "$GITHUB_WORKSPACE" \
            --run \
            --phase repository-direct \
            --output-dir "$EVIDENCE_ROOT/repository-direct" \
            --bootstrap-manifest "$EVIDENCE_ROOT/bootstrap/bootstrap.json" \
            --github-head-sha "$EXPECTED_HEAD_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-repository "$GITHUB_REPOSITORY" \
            --container-image "$RK_PLATFORM_CONTAINER_IMAGE"
          (cd "$EVIDENCE_ROOT/repository-direct" && sha256sum --check --strict SHA256SUMS)

      - name: Capture complete closure and replay it offline
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/rk003-closure-offline-evidence
        run: |
          set -euo pipefail
          python3 scripts/rocky_kernel_closure_offline.py \
            --repo "$GITHUB_WORKSPACE" \
            --capture \
            --phase closure-offline \
            --direct-root "$EVIDENCE_ROOT/repository-direct" \
            --output-dir "$EVIDENCE_ROOT/closure-offline" \
            --github-head-sha "$EXPECTED_HEAD_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-repository "$GITHUB_REPOSITORY" \
            --container-image "$RK_PLATFORM_CONTAINER_IMAGE"
          (cd "$EVIDENCE_ROOT/closure-offline" && sha256sum --check --strict SHA256SUMS)

      - name: Upload closure, replay, and probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rk003-closure-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rk003-closure-offline-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
