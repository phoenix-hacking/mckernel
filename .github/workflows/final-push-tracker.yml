name: Final push completion tracker

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker:
    name: Recalculate evidence-weighted completion
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize frozen IHK source
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 ihk

      - name: Validate frozen host-module inventory
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/host_module_inventory.py
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/host_module_inventory.py --check
          python3 scripts/rocky_kernel_source_lock.py --check
          python3 scripts/rocky_kernel_source_review.py --check
          python3 scripts/rocky_kernel_platform_lock.py --check
          python3 scripts/linux_api_needs.py --check
          python3 scripts/rocky_rust_staging.py --check
          python3 -m py_compile scripts/native_rust_build_surface_audit.py
          python3 scripts/native_rust_build_surface_audit.py
          python3 scripts/native_rust_host_audit.py
          python3 -m py_compile scripts/native_rust_unsafe_ffi_ledger.py
          python3 scripts/native_rust_unsafe_ffi_ledger.py check
          python3 -m py_compile scripts/mcctrl_native_lifecycle_check.py
          python3 scripts/mcctrl_native_lifecycle_check.py

      - name: Validate locked scope, policy, and behavior contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/host_module_contracts.py
          python3 scripts/host_module_contracts.py --check

      - name: Validate tracker implementation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/final_push_tracker.py
          python3 scripts/final_push_tracker.py \
            --check \
            --json evidence/final-push-summary.json

      - name: Prove recalculation is idempotent
        run: |
          set -euo pipefail
          cp final-push.txt /tmp/final-push.recalculated.txt
          python3 scripts/final_push_tracker.py \
            --file /tmp/final-push.recalculated.txt \
            --update
          cmp final-push.txt /tmp/final-push.recalculated.txt

      - name: Prove stale and invalid trackers fail closed
        run: |
          set -euo pipefail

          cp final-push.txt /tmp/final-push.stale.txt
          sed -i 's/^OVERALL COMPLETION:.*/OVERALL COMPLETION: STALE/' \
            /tmp/final-push.stale.txt
          if python3 scripts/final_push_tracker.py \
              --file /tmp/final-push.stale.txt --check; then
            echo 'stale generated summary was incorrectly accepted' >&2
            exit 1
          fi

          cp final-push.txt /tmp/final-push.missing-evidence.txt
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/final-push.missing-evidence.txt")
          lines = path.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if not line.startswith("GATE|"):
                  continue
              fields = line.split("|")
              fields[4] = "PASS"
              fields[5] = "-"
              lines[index] = "|".join(fields)
              break
          else:
              raise SystemExit("no gate record found for missing-evidence fixture")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          if python3 scripts/final_push_tracker.py \
              --file /tmp/final-push.missing-evidence.txt --check; then
            echo 'PASS without evidence was incorrectly accepted' >&2
            exit 1
          fi

          cp final-push.txt /tmp/final-push.bad-weight.txt
          sed -i \
            's/^WORKSTREAM|WS00|Scope, baseline, and evidence system|400$/WORKSTREAM|WS00|Scope, baseline, and evidence system|401/' \
            /tmp/final-push.bad-weight.txt
          if python3 scripts/final_push_tracker.py \
              --file /tmp/final-push.bad-weight.txt --check; then
            echo 'invalid 10000-point denominator was incorrectly accepted' >&2
            exit 1
          fi

      - name: Publish current completion in job summary
        run: |
          set -euo pipefail
          {
            echo '## Native Rust host-module completion'
            echo
            sed -n \
              '/^BEGIN AUTO-GENERATED TRACKER$/,/^END AUTO-GENERATED TRACKER$/p' \
              final-push.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable tracker state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-push-tracker-${{ github.sha }}
          path: evidence/final-push-summary.json
          if-no-files-found: error
          retention-days: 90
