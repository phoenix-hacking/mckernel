name: Rocky 10.2 signed repository snapshot capture v2

on:
  workflow_dispatch:
    inputs:
      validation_sha:
        description: Exact 40-hex candidate commit to capture against
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ inputs.validation_sha }}
  RK_SNAPSHOT_CONTAINER_IMAGE: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176

jobs:
  capture:
    name: Signed metadata closure capture (credit forbidden)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176
    defaults:
      run:
        shell: bash

    steps:
      - name: Initialize always-uploaded diagnostics
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/rocky-repository-snapshot-v2
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE_ROOT"
          mkdir -m 700 -p "$EVIDENCE_ROOT/diagnostics"
          python3 - "$EVIDENCE_ROOT/diagnostics/run-context.json" <<'PY'
          import json
          import os
          import sys

          value = {
              "claims": {
                  "accepted_checkpoint": False,
                  "credit_eligible": False,
                  "durable_archive": False,
                  "tracker_credit": False,
              },
              "container_image": os.environ["RK_SNAPSHOT_CONTAINER_IMAGE"],
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_sha": os.environ["GITHUB_SHA"],
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "github_workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "requested_head_sha": os.environ["EXPECTED_HEAD_SHA"],
              "schema_version": 1,
          }
          with open(sys.argv[1], "w") as output:
              json.dump(value, output, allow_nan=False, separators=(",", ":"), sort_keys=True)
              output.write("\n")
          value = {
              "capture_id": "rocky-10.2-x86_64-repository-metadata-capture-v2",
              "claims": value["claims"],
              "error": "capture did not start or terminate normally",
              "observations": [],
              "schema_version": 1,
              "status": "not-started",
          }
          with open(os.path.join(os.path.dirname(sys.argv[1]), "drift-report.json"), "w") as output:
              json.dump(value, output, allow_nan=False, separators=(",", ":"), sort_keys=True)
              output.write("\n")
          PY

      - name: Install bounded verification tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = rocky
          test "$VERSION_ID" = 10.2
          dnf -y --setopt=install_weak_deps=False install \
            bzip2 git-core gnupg2 gzip python3 python3-pyyaml tar xz
          dnf clean all
          for tool in git gpg gpgv python3 sha256sum tar; do
            command -v "$tool" >/dev/null
          done
          python3 -c 'import yaml'

      - name: Check out the exact requested candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: true

      - name: Validate the no-credit capture contract
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_HEAD_SHA"
          case "$GITHUB_WORKFLOW_REF" in
            "$GITHUB_REPOSITORY/.github/workflows/rocky-repository-snapshot-capture-v2.yml@refs/heads/"*|\
            "$GITHUB_REPOSITORY/.github/workflows/rocky-repository-snapshot-capture-v2.yml@refs/tags/"*) ;;
            *) echo "unexpected workflow ref: $GITHUB_WORKFLOW_REF" >&2; exit 1 ;;
          esac
          canonical_workspace="$(python3 -c \
            'import os, sys; print(os.path.realpath(sys.argv[1]))' \
            "$GITHUB_WORKSPACE")"
          bootstrap_home="$RUNNER_TEMP/rocky-snapshot-bootstrap-home"
          committed_checker="$RUNNER_TEMP/rocky-repository-snapshot-capture-v2-check.py"
          test ! -e "$committed_checker"
          mkdir -m 700 -p "$bootstrap_home"
          test "$(env -i \
            PATH="$PATH" HOME="$bootstrap_home" LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_GRAFT_FILE=/dev/null \
            GIT_NO_REPLACE_OBJECTS=1 \
            git -c "safe.directory=$canonical_workspace" \
            -C "$canonical_workspace" rev-parse --verify 'HEAD^{commit}')" = \
            "$EXPECTED_HEAD_SHA"
          umask 077
          set -C
          env -i \
            PATH="$PATH" HOME="$bootstrap_home" LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_GRAFT_FILE=/dev/null \
            GIT_NO_REPLACE_OBJECTS=1 \
            git -c "safe.directory=$canonical_workspace" \
            -C "$canonical_workspace" show \
            "$EXPECTED_HEAD_SHA:scripts/rocky_repository_snapshot_capture.py" \
            >"$committed_checker"
          chmod 0400 "$committed_checker"
          test -s "$committed_checker"
          PYTHONDONTWRITEBYTECODE=1 python3 "$committed_checker" \
            --repo "$GITHUB_WORKSPACE" \
            --check \
            --source-commit "$EXPECTED_HEAD_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            scripts.tests.test_rocky_repository_snapshot_capture

      - name: Capture and verify the signed metadata closure
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/rocky-repository-snapshot-v2
        run: |
          set -euo pipefail
          canonical_workspace="$(python3 -c \
            'import os, sys; print(os.path.realpath(sys.argv[1]))' \
            "$GITHUB_WORKSPACE")"
          bootstrap_home="$RUNNER_TEMP/rocky-snapshot-bootstrap-home"
          committed_checker="$RUNNER_TEMP/rocky-repository-snapshot-v2-capture.py"
          test ! -e "$committed_checker"
          mkdir -m 700 -p "$bootstrap_home"
          umask 077
          set -C
          env -i \
            PATH="$PATH" HOME="$bootstrap_home" LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_GRAFT_FILE=/dev/null \
            GIT_NO_REPLACE_OBJECTS=1 \
            git -c "safe.directory=$canonical_workspace" \
            -C "$canonical_workspace" show \
            "$EXPECTED_HEAD_SHA:scripts/rocky_repository_snapshot_capture.py" \
            >"$committed_checker"
          chmod 0400 "$committed_checker"
          test -s "$committed_checker"
          PYTHONDONTWRITEBYTECODE=1 python3 "$committed_checker" \
            --repo "$GITHUB_WORKSPACE" \
            --capture \
            --output-dir "$EVIDENCE_ROOT/payload" \
            --diagnostics-dir "$EVIDENCE_ROOT/diagnostics" \
            --source-commit "$EXPECTED_HEAD_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"
          (cd "$EVIDENCE_ROOT/payload" && sha256sum --check --strict snapshot.tar.sha256)
          PYTHONDONTWRITEBYTECODE=1 python3 "$committed_checker" \
            --repo "$GITHUB_WORKSPACE" \
            --verify-artifact "$EVIDENCE_ROOT/payload/snapshot.tar" \
            --source-commit "$EXPECTED_HEAD_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deterministic payload and drift diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rocky-repository-snapshot-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rocky-repository-snapshot-v2/payload/snapshot.tar
            ${{ runner.temp }}/rocky-repository-snapshot-v2/payload/snapshot.tar.sha256
            ${{ runner.temp }}/rocky-repository-snapshot-v2/diagnostics/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
