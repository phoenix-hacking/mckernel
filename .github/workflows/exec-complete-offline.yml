name: Complete exec changed-scope qualification
on:
  push:
    branches: ['codex/exec-complete-ci-20261114']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            kernel
          persist-credentials: false
      - name: Use the existing pinned compiler
        run: rustup toolchain install nightly-2026-02-19 --profile minimal
      - name: Complete actual Rust exec lifecycle and paired C selection
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-02-19
        run: python3 -B -m unittest -v scripts.tests.test_f03_execveat_complete.CompleteExecTests.test_actual_rust_exec_module_preserves_error_and_lifetime_contracts
