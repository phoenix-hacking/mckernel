name: OS goal mailbox checks

on:
  pull_request:
    paths:
      - 'scripts/*os_goal*'
      - 'scripts/tests/*os_goal*'
      - '.github/workflows/mckernel-mailbox-notify.yml'
      - '.github/workflows/os-goal-mailbox-checks.yml'
  push:
    branches: [codex/local-native-staging-repair]
    paths:
      - 'scripts/*os_goal*'
      - 'scripts/tests/*os_goal*'
      - '.github/workflows/mckernel-mailbox-notify.yml'
      - '.github/workflows/os-goal-mailbox-checks.yml'

permissions:
  contents: read

concurrency:
  group: os-goal-mailbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mailbox:
    name: Offline mailbox and queue contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/
            /docs/verification/m14-m15-closure-progress.json
      - name: Install the test-only YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/mailbox-tests"
          "$RUNNER_TEMP/mailbox-tests/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Exercise message, file, queue and status behavior offline
        shell: bash
        run: |
          "$RUNNER_TEMP/mailbox-tests/bin/python" -B - <<'PY'
          import unittest
          from unittest.mock import patch

          modules = [
              "scripts.tests.test_os_goal_mailbox",
              "scripts.tests.test_os_goal_mailbox_workflow",
              "scripts.tests.test_os_goal_mailbox_protocol",
              "scripts.tests.test_send_os_goal_message",
              "scripts.tests.test_os_goal_file_mailbox",
              "scripts.tests.test_os_goal_queue",
              "scripts.tests.test_os_goal_instructions",
              "scripts.tests.test_os_goal_capture_progress",
              "scripts.tests.test_os_goal_mailbox_status",
              "scripts.tests.test_os_goal_status_feed",
              "scripts.tests.test_os_goal_status_text.StatusTextTests.test_current_agents_are_union_of_roster_and_observed_turns",
          ]
          def checked(suite):
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if (not result.wasSuccessful() or not result.testsRun or result.skipped
                      or result.expectedFailures or result.unexpectedSuccesses):
                  raise SystemExit(1)

          checked(unittest.defaultTestLoader.loadTestsFromNames(modules))
          from scripts.tests import test_os_goal_launcher as lifecycle
          names = [
              "test_live_instruction_is_queued_and_delivered_to_active_coordinator",
              "test_live_instruction_waits_during_checkpoint_and_rejects_invalid_text",
              "test_startup_instruction_precedes_saved_goal_resume_and_activation",
              "test_fresh_startup_user_message_precedes_goal_activation_once",
              "test_uncertain_startup_delivery_keeps_goal_paused_and_records_receipt",
          ]
          # Fake-RPC lifecycle cases use a temporary repository and no workloads.
          # This test-only mock avoids imposing workstation RAM/disk admission
          # on the CI runner; production resource checks are unchanged.
          with patch.object(lifecycle.launcher, "check_resources", return_value=None):
              checked(unittest.TestSuite(lifecycle.CampaignTests(name) for name in names))
          PY
