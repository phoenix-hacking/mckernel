name: Coherent lifecycle source qualification
on:
  push:
    branches: ['codex/lifecycle-ci-20261114']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts
            host-kernel
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Materialize the exact committed IHK source
        run: python3 -B scripts/restore_ihk_source.py
      - name: Validate all three complete lifecycle source modules
        env:
          PYTHONPATH: scripts:scripts/tests
        run: |
          python3 -B -m unittest -v \
            scripts.tests.test_ihk_native_lifecycle_check \
            scripts.tests.test_ihk_smp_native_lifecycle_check \
            scripts.tests.test_mcctrl_native_lifecycle_check
