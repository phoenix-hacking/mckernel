name: Source registry changed-scope qualification
on:
  push:
    branches: ['codex/source-registry-ci-20261114']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changed-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Qualify registry and affected campaign paths
        env:
          PYTHONPATH: scripts:scripts/tests
        run: |
          python3 -B -m unittest \
            scripts.tests.test_os_goal_source_registry \
            scripts.tests.test_os_goal_source_work \
            scripts.tests.test_os_goal_source_work_bridge \
            scripts.tests.test_os_goal_launcher \
            scripts.tests.test_os_goal_continuous \
            scripts.tests.test_os_goal_continuous_eligibility \
            scripts.tests.test_os_goal_owner_retention \
            scripts.tests.test_os_goal_capture_progress
