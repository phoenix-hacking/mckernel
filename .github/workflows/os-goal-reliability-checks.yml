name: OS goal unattended reliability

on:
  pull_request:
    paths:
      - 'scripts/*os_goal*'
      - 'scripts/launch_m14_m15.py'
      - 'scripts/tests/test_launch_m14_m15.py'
      - 'scripts/tests/*os_goal*'
      - 'docs/verification/m14-m15-closure-progress.json'
      - '.github/workflows/os-goal-reliability-checks.yml'
      - '.github/workflows/final-push-tracker.yml'
      - 'scripts/tests/test_final_push_tracker_workflow.py'
  push:
    branches: ['codex/harness-reliability-*', 'codex/local-native-staging-repair']
    paths:
      - 'scripts/*os_goal*'
      - 'scripts/launch_m14_m15.py'
      - 'scripts/tests/test_launch_m14_m15.py'
      - 'scripts/tests/*os_goal*'
      - 'docs/verification/m14-m15-closure-progress.json'
      - '.github/workflows/os-goal-reliability-checks.yml'
      - '.github/workflows/final-push-tracker.yml'
      - 'scripts/tests/test_final_push_tracker_workflow.py'

permissions:
  contents: read

concurrency:
  group: os-goal-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unattended:
    name: Unattended decisions, delivery and operation custody
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/
            /instructions/
            /.codex/config.toml
            /AGENTS.md
            /CAMPAIGN.md
            /docs/verification/m14-m15-closure-progress.json
      - name: Install test-only YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/reliability-tests"
          "$RUNNER_TEMP/reliability-tests/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Exercise actual controller decisions and bounded harmless processes
        env:
          PYTHONPATH: scripts:scripts/tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/reliability-tests/bin/python" -B - <<'PY'
          import unittest

          # Fake RPC/service fixtures plus temporary ordinary HOST child
          # processes. No model, GitHub writes, native workload or held replay.
          modules = [
              "scripts.tests.test_final_push_tracker_workflow",
              "scripts.tests.test_launch_m14_m15",
              "scripts.tests.test_os_goal_capture_progress",
              "scripts.tests.test_os_goal_continuous",
              "scripts.tests.test_os_goal_continuous_eligibility",
              "scripts.tests.test_os_goal_continuous_launch",
              "scripts.tests.test_os_goal_credit_timeout",
              "scripts.tests.test_os_goal_credits",
              "scripts.tests.test_os_goal_custody",
              "scripts.tests.test_os_goal_file_mailbox",
              "scripts.tests.test_os_goal_fresh_cli",
              "scripts.tests.test_os_goal_guardian",
              "scripts.tests.test_os_goal_handoff_provenance",
              "scripts.tests.test_os_goal_instruction_order",
              "scripts.tests.test_os_goal_instructions",
              "scripts.tests.test_os_goal_launcher",
              "scripts.tests.test_os_goal_mailbox",
              "scripts.tests.test_os_goal_mailbox_monitor",
              "scripts.tests.test_os_goal_mailbox_protocol",
              "scripts.tests.test_os_goal_mailbox_status",
              "scripts.tests.test_os_goal_mailbox_workflow",
              "scripts.tests.test_os_goal_monitor_startup",
              "scripts.tests.test_os_goal_operations",
              "scripts.tests.test_os_goal_overnight",
              "scripts.tests.test_os_goal_overnight_prepare",
              "scripts.tests.test_os_goal_owner_retention",
              "scripts.tests.test_os_goal_power",
              "scripts.tests.test_os_goal_progress",
              "scripts.tests.test_os_goal_queue",
              "scripts.tests.test_os_goal_readiness",
              "scripts.tests.test_os_goal_reliability_integration",
              "scripts.tests.test_os_goal_repair",
              "scripts.tests.test_os_goal_resources",
              "scripts.tests.test_os_goal_service",
              "scripts.tests.test_os_goal_sessions",
              "scripts.tests.test_os_goal_source_registry",
              "scripts.tests.test_os_goal_source_work",
              "scripts.tests.test_os_goal_source_work_bridge",
              "scripts.tests.test_os_goal_status_feed",
              "scripts.tests.test_os_goal_status_publish",
              "scripts.tests.test_os_goal_status_text",
              "scripts.tests.test_os_goal_stop_log",
              "scripts.tests.test_os_goal_transport",
              "scripts.tests.test_os_goal_watcher_retention",
              "scripts.tests.test_os_goal_windows",
              "scripts.tests.test_os_goal_work_scope",
              "scripts.tests.test_send_os_goal_message",
          ]
          def leaves(tests):
              for test in tests:
                  if isinstance(test, unittest.TestSuite):
                      yield from leaves(test)
                  else:
                      yield test

          suite = unittest.TestSuite()
          seen = set()
          for module in modules:
              tests = unittest.defaultTestLoader.loadTestsFromName(module)
              if not tests.countTestCases():
                  raise SystemExit("No tests loaded from " + module)
              # Some existing modules import shared TestCase classes. Execute
              # each case once, including imports through the short module path.
              for test in leaves(tests):
                  identity = test.id().removeprefix("scripts.tests.")
                  if identity not in seen:
                      seen.add(identity)
                      suite.addTest(test)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (not result.wasSuccessful() or not result.testsRun or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit(1)
          PY
