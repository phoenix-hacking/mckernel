name: M14 focused source checks

on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'arch/x86_64/kernel/**'
      - 'lib/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'executer/user/mcexec.c'
      - 'executer/user/rust/mcexec_helpers.rs'
      - '.github/workflows/m14-focused.yml'
  push:
    branches:
      - codex/m15-focused-checks-20261030
    paths:
      - 'kernel/**'
      - 'arch/x86_64/kernel/**'
      - 'lib/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'executer/user/mcexec.c'
      - 'executer/user/rust/mcexec_helpers.rs'
      - '.github/workflows/m14-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: M14 bounded HOST regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source without submodules or archived evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /kernel/
            /arch/
            /lib/
            /cmake/
            /scripts/
            /executer/user/mcexec.c
            /executer/user/rust/mcexec_helpers.rs

      - name: Verify source and retain the exact predecessor preservation fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags --depth=1 origin 5a5d7e77ab4ada91777f1ee06c5d7fbdb98f5b71
          git show 5a5d7e77ab4ada91777f1ee06c5d7fbdb98f5b71:arch/x86_64/kernel/syscall.c > /dev/null

      - name: Select the pinned ordinary HOST test tools
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-02-19 --profile minimal
          compiler=$(rustup which --toolchain nightly-2026-02-19 rustc)
          test "$("$compiler" --version)" = 'rustc 1.95.0-nightly (c04308580 2026-02-18)'
          python3 -m venv "$RUNNER_TEMP/m14-tools"
          "$RUNNER_TEMP/m14-tools/bin/python" -m pip install --disable-pip-version-check cmake==3.28.3 ninja==1.13.0
          echo "$RUNNER_TEMP/m14-tools/bin" >> "$GITHUB_PATH"
          echo "RUSTC=$compiler" >> "$GITHUB_ENV"
          echo "CMAKE=$RUNNER_TEMP/m14-tools/bin/cmake" >> "$GITHUB_ENV"
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"

      - name: Run the explicit M14 allowlist and reject skipped checks
        run: |
          set -euo pipefail
          python3 -B scripts/run_m14_focused_checks.py --json-output "$RUNNER_TEMP/m14-focused-results.json"

      - name: Preserve the bounded result record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m14-focused-${{ env.EXPECTED_HEAD_SHA }}
          path: ${{ runner.temp }}/m14-focused-results.json
          if-no-files-found: warn
          retention-days: 14
