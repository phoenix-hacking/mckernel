name: C4 affected C object and actual ABI
on:
  workflow_dispatch:
  push:
    branches: [codex/c4-c-object-20261114]
permissions:
  contents: read
  actions: read
jobs:
  affected-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            kernel
            arch/x86_64/kernel/include
            lib/include
            executer/include
            ci/c4-c-object
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ihkmckernel/ihk
          ref: 8d288b8bd81b50cc3a3f814d949b89bf416a6ec7
          path: ihk
          sparse-checkout: |
            cokernel/smp/x86_64
            ikc/include
            linux/include
          persist-credentials: false
      - name: Reuse the passed whole Rust object without recompiling
        uses: actions/download-artifact@v4
        with:
          name: c4-whole-production-rust-object
          path: c4-passed-rust
          github-token: ${{ github.token }}
          run-id: 43544756870
      - name: Compile only the changed C translation unit and compare actual ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4-c-object-output
          docker run --rm -v "$PWD:/src" -v "$PWD/c4-c-object-output:/work/output/build" rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176 /bin/bash -lc 'set -euo pipefail; dnf install -y gcc-14.3.1-4.4.el10 cpp-14.3.1-4.4.el10 binutils-2.41-63.el10 python3; python3 /src/ci/c4-c-object/compile_c_and_compare.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-affected-c-object-and-abi
          path: |
            c4-c-object-output/kernel/CMakeFiles/mckernel.img.dir/syscall.c.o
            c4-c-object-output/command.json
            c4-c-object-output/c-defined-symbols.txt
            c4-c-object-output/toolchain.txt
            c4-c-object-output/RESULT.json
          retention-days: 7
