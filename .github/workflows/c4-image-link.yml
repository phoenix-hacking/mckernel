name: C4 thirteen input image link
on:
  workflow_dispatch:
  push:
    branches: [codex/c4-image-link-20261114]
permissions:
  contents: read
  actions: read
jobs:
  image-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: ci/c4-image-link
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c4-whole-production-rust-object
          path: c4-passed-rust
          github-token: ${{ github.token }}
          run-id: 43544756870
      - uses: actions/download-artifact@v4
        with:
          name: c4-affected-c-object-and-abi
          path: c4-passed-c
          github-token: ${{ github.token }}
          run-id: 43545564044
      - name: Link once with the retained eleven inputs and two passed replacements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4-image-link-output
          docker run --rm -v "$PWD:/src" -v "$PWD/c4-image-link-output:/work/output" rockylinux/rockylinux:10.2@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176 /bin/bash -lc 'set -euo pipefail; dnf install -y binutils-2.41-63.el10 python3; python3 /src/ci/c4-image-link/link_image.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-thirteen-input-image
          path: |
            c4-image-link-output/kernel/mckernel.img
            c4-image-link-output/kernel/mckernel.img.map
            c4-image-link-output/kernel/CMakeFiles/mckernel.img.dir/link.d
            c4-image-link-output/command.json
            c4-image-link-output/RESULT.json
            c4-image-link-output/elf-*.txt
          retention-days: 7
